[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strandshift"
version = "0.1.0"
description = "Genomic sequence-model invariance auditor"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Doghri"}]
dependencies = []

[project.scripts]
strandshift = "strandshift.cli:main"

[tool.setuptools]
packages = ["strandshift"]

[tool.setuptools.package-data]
strandshift = ["web/*.html"]
